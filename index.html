<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mimar Sinan · Hold Up the Sky</title>
    <meta
      name="description"
      content="An interactive story about Mimar Sinan, chief architect of the Ottoman Empire, and how he built his masterwork, the Selimiye Mosque in Edirne: one dome, one room, filled with light."
    />
    <meta name="theme-color" content="#ece8e0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="/fonts/archivo-latin-wdth-normal.woff2"
      as="font"
      type="font/woff2"

    <link

  <body data-theme="stone">
    <a class="skip-link" href="#stage">Skip to the story</a>

    <header class="hud">
      <nav class="progress" aria-label="Story">
        <p class="progress__label" id="progress-label"></p>
        <ol class="progress__list" id="progress-list"></ol>
      </nav>
      <button type="button" class="sound-toggle" id="sound-toggle" aria-pressed="false"></button>

    <p class="sr-only" id="announcer" aria-live="polite" aria-atomic="true"></p>

    <noscript>
      <p style="padding: 2rem; max-width: 40rem">
        This interactive story needs JavaScript. It is about Mimar Sinan (c. 1490–1588), chief
        architect of the Ottoman Empire for about fifty years, and the Selimiye Mosque in Edirne
        (1575), which he called his masterwork: one dome on eight piers, over one open room, its
        walls opened to daylight.
      </p>
    </noscript>

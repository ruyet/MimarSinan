<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Hold Up the Sky — Selimiye Mosque</title>
    <meta
      name="description"
      content="An interactive story about how Mimar Sinan covered one vast, light-filled space with a single dome at the Selimiye Mosque in Edirne."
    />
    <meta name="theme-color" content="#14161c" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="/fonts/fraunces-latin-full-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/instrument-sans-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin

  <body data-theme="night">
    <a class="skip-link" href="#stage">Skip to the story</a>

    <header class="hud">
      <nav class="progress" aria-label="Chapters">
        <p class="progress__label" id="progress-label"></p>
        <ol class="progress__list" id="progress-list"></ol>
      </nav>
      <div class="discovery" id="discovery"></div>
      <button type="button" class="sound-toggle" id="sound-toggle" aria-pressed="false"></button>

    <p class="sr-only" id="announcer" aria-live="polite" aria-atomic="true"></p>

    <noscript>
      <p style="padding: 2rem; max-width: 40rem">
        This interactive story needs JavaScript. It tells how Mimar Sinan covered the prayer hall of
        the Selimiye Mosque (Edirne, 1574–75) with a single dome on eight piers, freeing the walls
